services:
  neo4j:
    image: neo4j:5.26-community
    container_name: kb-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    volumes:
      - kb-neo4j-data:/data
    restart: unless-stopped

volumes:
  kb-neo4j-data:
